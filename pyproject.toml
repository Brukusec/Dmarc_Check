[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "email-domain-security-auditor"
version = "0.1.0"
description = "Defensive email domain security posture auditor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Security Engineering" }]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "dnspython>=2.6.1",
  "jinja2>=3.1.4",
  "PySide6>=6.7.0",
]

[project.scripts]
audit = "audit.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src"]
